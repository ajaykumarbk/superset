version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: superset_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_local_pw
      POSTGRES_DB: superset_db
    ports:
      - "5432:5432"
    volumes:
      - superset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  superset_pgdata:
